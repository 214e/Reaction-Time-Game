<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reaction Time</title>
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        display: flex;
        flex-direction: column;
        gap: 5vh;
        padding: 1vh;
      }
      #reactionButton {
        width: 10vw;
        height: 10vh;
      }
    </style>

    <h1 id="title">⚡ Reaction time</h1>

        Reset High Score
      </button>
    </div>
    <h1 id="stats">Нэрээ бичээд «Эхлэх» дар</h1>
    <button onclick="react()" id="reactionButton"></button>
    <script src="./script.js"></script>
  </body>
</html>
